<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detect Fraud — FraudGuard AI</title>
    <meta name="description" content="Analyze a transaction for fraud in seconds using our AI model.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="mesh-bg"></div>

    <!-- NAV -->
    <header class="site-header scrolled" id="siteHeader">
        <nav class="nav-inner">
            <a href="/" class="brand">
                <svg class="brand-icon" viewBox="0 0 28 28" fill="none">
                    <path d="M14 2L4 7v8c0 5.55 4.3 10.74 10 12 5.7-1.26 10-6.45 10-12V7L14 2z" fill="url(#sg)" />
                    <path d="M10 14l3 3 5-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="sg" x1="4" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                </svg>
                <span>FraudGuard<span class="brand-ai"> AI</span></span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/detect" class="nav-link" style="color:var(--text-1)">Detect Fraud</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Analyzing transaction...</p>
    </div>

    <!-- FORM -->
    <main class="detect-page">
        <div class="detect-card">
            <h1>Transaction Analysis</h1>
            <p class="lead">Enter the transaction details below. Our AI model will classify it as <strong>Safe</strong>
                or <strong>Fraud</strong> in milliseconds.</p>

            <form action="/predict" method="POST" id="detectForm">

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <div class="select-wrapper">
                        <select name="type" id="type" required>
                            <option value="" disabled selected>Select type…</option>
                            <option value="TRANSFER">💸 TRANSFER</option>
                            <option value="CASH_OUT">🏧 CASH_OUT</option>
                            <option value="CASH_IN">💰 CASH_IN</option>
                            <option value="PAYMENT">💳 PAYMENT</option>
                            <option value="DEBIT">🏦 DEBIT</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="amount">Transaction Amount ($)</label>
                    <input type="number" name="amount" id="amount" placeholder="e.g. 50000" min="0" step="0.01"
                        required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="oldbalanceOrg">Sender: Old Balance ($)</label>
                        <input type="number" name="oldbalanceOrg" id="oldbalanceOrg" placeholder="e.g. 100000" min="0"
                            step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="newbalanceOrig">Sender: New Balance ($)</label>
                        <input type="number" name="newbalanceOrig" id="newbalanceOrig" placeholder="e.g. 50000" min="0"
                            step="0.01" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="oldbalanceDest">Receiver: Old Balance ($)</label>
                        <input type="number" name="oldbalanceDest" id="oldbalanceDest" placeholder="e.g. 0" min="0"
                            step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="newbalanceDest">Receiver: New Balance ($)</label>
                        <input type="number" name="newbalanceDest" id="newbalanceDest" placeholder="e.g. 50000" min="0"
                            step="0.01" required>
                    </div>
                </div>

                <button type="submit" class="form-submit">
                    <svg viewBox="0 0 20 20" fill="none" style="width:18px;height:18px;">
                        <path d="M10 2L2 10l8 8M15 5l5 5-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Analyze Transaction
                </button>
            </form>
        </div>
    </main>

    <script>
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', e => {
            glow.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
        }, { passive: true });

        document.getElementById('detectForm').addEventListener('submit', () => {
            document.getElementById('loadingOverlay').classList.add('active');
        });

        const toggle = document.getElementById('navToggle');
        const menu = document.getElementById('navMenu');
        toggle?.addEventListener('click', () => {
            menu.classList.toggle('open');
            toggle.classList.toggle('open');
        });
    </script>
</body>

</html>
